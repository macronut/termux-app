name: Build and Release Android 7+ arm64

on:
  push:
    branches:
      - master
      - 'github-releases/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TERMUX_PACKAGE_VARIANT: apt-android-7

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        run: |
          compile_sdk=$(sed -n 's/^compileSdkVersion=//p' gradle.properties)
          ndk_version=$(sed -n 's/^ndkVersion=//p' gradle.properties)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-$compile_sdk" "ndk;$ndk_version"

      - name: Set APK version
        shell: bash
        env:
          VERSION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version=$(sed -n 's/^ *versionName "\([^"]*\)"$/\1/p' app/build.gradle)
          test -n "$version"
          echo "TERMUX_APP_VERSION_NAME=$version+${VERSION_SHA:0:7}" >> "$GITHUB_ENV"
          echo "TERMUX_APK_VERSION_TAG=v$version+${VERSION_SHA:0:7}-apt-android-7-github-debug" >> "$GITHUB_ENV"
          echo "TERMUX_RELEASE_TAG=v$version+${VERSION_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Build arm64 APK
        run: ./gradlew :app:assembleDebug -PtermuxAbiFilters=arm64-v8a

      - name: Verify APK and generate checksum
        working-directory: app/build/outputs/apk/debug
        run: |
          apk="termux-app_${TERMUX_APK_VERSION_TAG}_arm64-v8a.apk"
          test -s "$apk"
          sha256sum "$apk" > "termux-app_${TERMUX_APK_VERSION_TAG}_sha256sums"

      - name: Upload arm64 APK and checksum
        uses: actions/upload-artifact@v6
        with:
          name: termux-android7-arm64-${{ github.sha }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/termux-app_${{ env.TERMUX_APK_VERSION_TAG }}_arm64-v8a.apk
            app/build/outputs/apk/debug/termux-app_${{ env.TERMUX_APK_VERSION_TAG }}_sha256sums
            app/build/outputs/apk/debug/output-metadata.json

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        working-directory: app/build/outputs/apk/debug
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$TERMUX_RELEASE_TAG"
          apk="termux-app_${TERMUX_APK_VERSION_TAG}_arm64-v8a.apk"
          checksum="termux-app_${TERMUX_APK_VERSION_TAG}_sha256sums"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$checksum" --clobber
          else
            gh release create "$tag" "$apk" "$checksum" \
              --target "$GITHUB_SHA" \
              --title "$tag Android 7+ arm64" \
              --notes "Android 7.0+ / arm64-v8a. Debug-signed APK built from commit $GITHUB_SHA." \
              --latest
          fi
