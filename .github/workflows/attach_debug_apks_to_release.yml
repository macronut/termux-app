name: Attach Android 7+ arm64 Debug APK To Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  attach-apks:
    runs-on: ubuntu-latest
    env:
      TERMUX_PACKAGE_VARIANT: apt-android-7

    steps:
      - name: Clone release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        run: |
          compile_sdk=$(sed -n 's/^compileSdkVersion=//p' gradle.properties)
          ndk_version=$(sed -n 's/^ndkVersion=//p' gradle.properties)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-$compile_sdk" "ndk;$ndk_version"

      - name: Set release version
        shell: bash
        run: |
          # Keep upstream's semantic-version requirement for manually published tags.
          printf '%s' "${GITHUB_REF_NAME#v}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
          echo "TERMUX_APK_VERSION_TAG=${GITHUB_REF_NAME}+apt-android-7-github-debug" >> "$GITHUB_ENV"

      - name: Build arm64 APK
        run: ./gradlew :app:assembleDebug -PtermuxAbiFilters=arm64-v8a

      - name: Verify APK and generate checksum
        working-directory: app/build/outputs/apk/debug
        run: |
          apk="termux-app_${TERMUX_APK_VERSION_TAG}_arm64-v8a.apk"
          test -s "$apk"
          sha256sum "$apk" > "termux-app_${TERMUX_APK_VERSION_TAG}_sha256sums"

      - name: Upload APK and checksum to release
        working-directory: app/build/outputs/apk/debug
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "termux-app_${TERMUX_APK_VERSION_TAG}_arm64-v8a.apk" \
            "termux-app_${TERMUX_APK_VERSION_TAG}_sha256sums" \
            --clobber
